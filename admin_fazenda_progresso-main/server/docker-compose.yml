services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fazenda_progresso
    ports:
      - "5432:5432"
    volumes:
      - fazenda_progresso_pgdata:/var/lib/postgresql/data

volumes:
  fazenda_progresso_pgdata:
